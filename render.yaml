services:
  - type: web
    name: uni-park-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: uni-park-db
          property: connectionString

databases:
  - name: uni-park-db
    databaseName: uni_park
    user: uni_park_user
    plan: free
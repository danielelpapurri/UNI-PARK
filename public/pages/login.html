<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - UNI-PARK</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="login-page">
    <div class="login-layout">
      <aside class="brand-panel">
        <div class="brand-badges">
          <img src="/images/Escudos.png" alt="Escudos" />
        </div>
        <img class="brand-logo" src="/images/Logo.png" alt="Logo UNI-PARK" />
        <h1>UNI-PARK</h1>
        <p>Control inteligente de ingreso, salida y reservas del parqueadero.</p>
        <div class="brand-mark">
          <img src="/images/logo%20parqueadero.png" alt="Parqueadero" />
        </div>
      </aside>

      <section class="login-panel">
        <div class="login-card">
          <div class="login-header">
            <h2>Inicio de sesión</h2>
            <p>Accede al sistema para gestionar vehículos y reservas.</p>
          </div>

          <form id="loginForm">
            <div class="form-group">
              <label for="usuario">Usuario</label>
              <input id="usuario" name="usuario" type="text" placeholder="Ingrese su usuario" required />
            </div>

            <div class="form-group">
              <label for="contrasena">Contraseña</label>
              <input id="contrasena" name="contrasena" type="password" placeholder="Ingrese su contraseña" required />
            </div>

            <div class="form-actions stacked">
              <button type="submit" class="btn btn-primary">Iniciar sesión</button>
              <a href="/pages/register.html" class="btn btn-secondary">Registrarse</a>
              <a href="/index.html" class="btn btn-secondary">Volver al inicio</a>
            </div>

            <div id="alertBox" class="alert"></div>
          </form>
        </div>
      </section>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>

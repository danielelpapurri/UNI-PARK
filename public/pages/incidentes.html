<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incidentes - UNI-PARK</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="form-shell">
      <header class="form-header">
        <h1>Registrar incidente</h1>
      </header>

      <main class="form-body">
        <form id="incidentForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="placaIncidente">Placa del vehículo</label>
              <input id="placaIncidente" name="placaIncidente" type="text" required />
            </div>

            <div class="form-group">
              <label for="fechaIncidente">Fecha del incidente</label>
              <input id="fechaIncidente" name="fechaIncidente" type="date" required />
            </div>

            <div class="form-group full">
              <label for="horaIncidente">Hora del incidente</label>
              <input id="horaIncidente" name="horaIncidente" type="time" required />
            </div>

            <div class="form-group full">
              <label for="descripcionIncidente">Descripción</label>
              <textarea id="descripcionIncidente" name="descripcionIncidente" required placeholder="Describa el incidente o problema..."></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-danger">Registrar</button>
            <a href="/pages/menu.html" class="btn btn-secondary">Volver al menú</a>
          </div>

          <div id="alertBox" class="alert"></div>
        </form>
      </main>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retiro de vehículo</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="form-shell">
      <header class="form-header">
        <h1>Módulo de salida de vehículos</h1>
      </header>

      <main class="form-body">
        <form id="exitForm">
          <div class="form-grid">
            <div class="form-group full">
              <label for="placaSalida">Placa del vehículo</label>
              <input id="placaSalida" name="placaSalida" type="text" placeholder="Buscar placa" required />
            </div>

            <div class="form-group">
              <label for="fechaEntrada">Fecha de entrada</label>
              <input id="fechaEntrada" name="fechaEntrada" type="date" disabled />
            </div>

            <div class="form-group">
              <label for="fechaSalida">Fecha de salida</label>
              <input id="fechaSalida" name="fechaSalida" type="date" disabled />
            </div>

            <div class="form-group">
              <label for="horaEntrada">Hora de entrada</label>
              <input id="horaEntrada" name="horaEntrada" type="time" disabled />
            </div>

            <div class="form-group">
              <label for="importe">Importe</label>
              <input id="importe" name="importe" type="text" disabled />
            </div>

            <div class="form-group full">
              <label for="novedades">Novedades</label>
              <textarea id="novedades" name="novedades" placeholder="Sin novedad"></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-danger">Retirar</button>
            <a href="/pages/menu.html" class="btn btn-secondary">Volver al menú</a>
          </div>

          <div id="alertBox" class="alert"></div>
        </form>
      </main>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>

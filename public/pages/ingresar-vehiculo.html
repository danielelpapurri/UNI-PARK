<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingreso de vehículo</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="form-shell">
      <header class="form-header">
        <h1>Módulo de ingreso de vehículos</h1>
      </header>

      <main class="form-body">
        <form id="vehicleForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="placa">Placa del vehículo</label>
              <input id="placa" name="placa" type="text" required />
            </div>

            <div class="form-group">
              <label for="propietario">Nombre del propietario</label>
              <input id="propietario" name="propietario" type="text" required />
            </div>

            <div class="form-group">
              <label for="fechaIngreso">Fecha de ingreso</label>
              <input id="fechaIngreso" name="fechaIngreso" type="date" required />
            </div>

            <div class="form-group">
              <label for="horaEntrada">Hora de entrada</label>
              <input id="horaEntrada" name="horaEntrada" type="time" required />
            </div>

            <div class="form-group">
              <label for="ubicacion">Ubicación / plaza</label>
              <select id="ubicacion" name="ubicacion" required></select>
            </div>

            <div class="form-group">
              <label for="tipoVehiculo">Tipo de vehículo</label>
              <select id="tipoVehiculo" name="tipoVehiculo" required>
                <option value="">Seleccione</option>
                <option value="Motocicleta">Motocicleta</option>
                <option value="Automovil">Automóvil</option>
              </select>
            </div>

            <div class="form-group full">
              <label for="condicion">Condición del vehículo</label>
              <textarea id="condicion" name="condicion" placeholder="Describa el estado del carro, daños o detalles relevantes..."></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-danger">Registrar</button>
            <a href="/pages/menu.html" class="btn btn-secondary">Volver al menú</a>
          </div>

          <div id="alertBox" class="alert"></div>
        </form>
      </main>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>

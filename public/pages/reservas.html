<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservas - UNI-PARK</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="form-shell">
      <header class="form-header">
        <h1>Módulo de reservas</h1>
      </header>

      <main class="form-body">
        <form id="reservationForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="propietarioReserva">Nombre del propietario</label>
              <input id="propietarioReserva" name="propietarioReserva" type="text" required />
            </div>

            <div class="form-group">
              <label for="ubicacionReserva">Ubicación</label>
              <select id="ubicacionReserva" name="ubicacionReserva" required></select>
            </div>

            <div class="form-group">
              <label for="fechaReserva">Fecha de reserva</label>
              <input id="fechaReserva" name="fechaReserva" type="date" required />
            </div>

            <div class="form-group">
              <label for="horaInicio">Hora de inicio</label>
              <input id="horaInicio" name="horaInicio" type="time" required />
            </div>

            <div class="form-group full">
              <label for="horaFin">Hora de fin</label>
              <input id="horaFin" name="horaFin" type="time" required />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-danger">Reservar</button>
            <a href="/pages/menu.html" class="btn btn-secondary">Volver al menú</a>
          </div>

          <div id="alertBox" class="alert"></div>
        </form>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Propietario</th>
              <th>Fecha</th>
              <th>Hora inicio</th>
              <th>Hora fin</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tblReservasBody"></tbody>
        </table>
      </main>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
